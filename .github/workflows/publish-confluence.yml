name: Publish to Confluence

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'index.md'
      - '.markdown-confluence.json'
      - '.github/workflows/publish-confluence.yml'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run without publishing (preview output only)'
        required: false
        default: 'false'

concurrency:
  group: publish-confluence
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish to Confluence
        env:
          CONFLUENCE_BASE_URL: ${{ vars.CONFLUENCE_BASE_URL }}
          CONFLUENCE_PARENT_ID: ${{ vars.CONFLUENCE_PARENT_ID }}
          CONFLUENCE_SPACE_KEY: ${{ vars.CONFLUENCE_SPACE_KEY }}
          ATLASSIAN_USER_NAME: ${{ secrets.ATLASSIAN_USER_NAME }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry-run }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "Dry run — would publish to ${CONFLUENCE_BASE_URL} (space=${CONFLUENCE_SPACE_KEY}, parent=${CONFLUENCE_PARENT_ID})"
            npx --yes @markdown-confluence/cli@latest --help
          else
            npx --yes @markdown-confluence/cli@latest
          fi
