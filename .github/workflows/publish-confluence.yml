name: Publish to Confluence

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - '.markdown-confluence.json'
      - 'scripts/**'
      - '.github/workflows/publish-confluence.yml'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run without publishing (preview config only)'
        required: false
        default: 'false'

concurrency:
  group: publish-confluence
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # needed to push connie-page-id back to the repo
    env:
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
      CONFLUENCE_PARENT_ID: ${{ secrets.CONFLUENCE_PARENT_ID }}
      ATLASSIAN_USER_NAME: ${{ secrets.ATLASSIAN_USER_NAME }}
      ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Dry run
        if: github.event.inputs.dry-run == 'true'
        run: ./scripts/publish-confluence.sh --dry

      - name: Publish
        if: github.event.inputs.dry-run != 'true'
        run: ./scripts/publish-confluence.sh

      - name: Persist any new connie-page-id back to repo
        if: github.event.inputs.dry-run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No new connie-page-id to persist."
          else
            git commit -m "chore(ci): persist connie-page-id after Confluence publish [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
