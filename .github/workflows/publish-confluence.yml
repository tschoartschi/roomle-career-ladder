name: Publish to Confluence

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'src/**'
      - '.github/workflows/publish-confluence.yml'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run without publishing (preview only)'
        required: false
        default: 'false'

concurrency:
  group: publish-confluence
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      CONFLUENCE_BASE_URL: ${{ vars.CONFLUENCE_BASE_URL }}
      CONFLUENCE_PARENT_ID: ${{ vars.CONFLUENCE_PARENT_ID }}
      CONFLUENCE_SPACE_KEY: ${{ vars.CONFLUENCE_SPACE_KEY }}
      CONFLUENCE_ARCHIVE_PARENT_ID: ${{ vars.CONFLUENCE_ARCHIVE_PARENT_ID }}
      ATLASSIAN_USER_NAME: ${{ secrets.ATLASSIAN_USER_NAME }}
      ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Dry run
        if: github.event.inputs.dry-run == 'true'
        run: node --experimental-strip-types src/publish.ts --dry-run

      - name: Publish
        if: github.event.inputs.dry-run != 'true'
        run: node --experimental-strip-types src/publish.ts

      - name: Persist any new confluence-page-id back to repo
        if: github.event.inputs.dry-run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No new confluence-page-id to persist."
          else
            git commit -m "chore(ci): persist confluence-page-id after publish [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
