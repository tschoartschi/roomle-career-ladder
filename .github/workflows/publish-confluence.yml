name: Publish to Confluence

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - '.markdown-confluence.json'
      - '.github/workflows/publish-confluence.yml'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run without publishing (preview output only)'
        required: false
        default: 'false'

concurrency:
  group: publish-confluence
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Publish to Confluence
        env:
          # Note: URL and parent ID are not really sensitive (could be Variables),
          # but storing them as Secrets is also fine and keeps the setup uniform.
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_PARENT_ID: ${{ secrets.CONFLUENCE_PARENT_ID }}
          ATLASSIAN_USER_NAME: ${{ secrets.ATLASSIAN_USER_NAME }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry-run }}" = "true" ]; then
            ./scripts/publish-confluence.sh --dry
          else
            ./scripts/publish-confluence.sh
          fi
