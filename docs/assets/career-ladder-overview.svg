<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 680" width="780" height="680">
  <defs>
    <style>
      .level-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 18px; fill: #333; font-weight: 500; }
      .track-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; fill: #555; text-anchor: middle; }
      .annotation { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #888; }
      .annotation-emph { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #666; font-style: italic; }
      .axis-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; fill: #999; }
      .bar-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #666; }
      .node { fill: #fff; stroke: #666; stroke-width: 2.5; }
      .node-large { fill: #fff; stroke: #666; stroke-width: 2.5; }
      .path-line { stroke: #bbb; stroke-width: 2; fill: none; }
      .bar { stroke: #999; stroke-width: 3; }
      .dotted { stroke: #ccc; stroke-width: 1; stroke-dasharray: 4,4; }
      .arrow-line { stroke: #999; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- Y-axis arrow -->
  <line class="arrow-line" x1="55" y1="455" x2="55" y2="80" />
  <polygon points="55,75 50,85 60,85" fill="#999" />

  <!-- Y-axis labels (rotated) -->
  <text transform="rotate(-90, 35, 380)" x="35" y="380" class="axis-label" text-anchor="middle">Roomle-specific</text>
  <text transform="rotate(-90, 35, 380)" x="35" y="393" class="axis-label" text-anchor="middle">knowledge needed</text>
  <text transform="rotate(-90, 35, 190)" x="35" y="190" class="axis-label" text-anchor="middle">Roomle context</text>
  <text transform="rotate(-90, 35, 190)" x="35" y="203" class="axis-label" text-anchor="middle">essential</text>

  <!-- Track labels at top -->
  <text x="270" y="60" class="track-label">Management</text>
  <text x="270" y="76" class="track-label">Track</text>
  <text x="450" y="60" class="track-label">Technical</text>
  <text x="450" y="76" class="track-label">Track</text>

  <!-- Level names (left) -->
  <text x="100" y="125" class="level-name">Lead</text>
  <text x="100" y="225" class="level-name">Senior L2</text>
  <text x="100" y="395" class="level-name">Senior L1</text>
  <text x="100" y="520" class="level-name">Expert</text>
  <text x="100" y="630" class="level-name">Junior</text>

  <!-- Vertical path (single track: Junior → Expert → Senior L1) -->
  <line class="path-line" x1="360" y1="620" x2="360" y2="405" />

  <!-- Fork from Senior L1 to Senior L2 (two curves diverging) -->
  <path class="path-line" d="M 360,385 C 360,340 450,290 450,220" />
  <path class="path-line" d="M 360,385 C 360,340 270,290 270,220" />

  <!-- Vertical paths in forked section (L2 to Lead) -->
  <line class="path-line" x1="450" y1="210" x2="450" y2="130" />
  <line class="path-line" x1="270" y1="210" x2="270" y2="130" />

  <!-- Nodes -->
  <!-- Junior -->
  <circle class="node" cx="360" cy="625" r="14" />
  <!-- Expert -->
  <circle class="node" cx="360" cy="515" r="14" />
  <!-- Senior L1 -->
  <circle class="node" cx="360" cy="390" r="14" />
  <!-- Senior L2 - Technical -->
  <circle class="node-large" cx="450" cy="220" r="14" />
  <!-- Senior L2 - Management -->
  <circle class="node-large" cx="270" cy="220" r="14" />
  <!-- Lead - Technical -->
  <circle class="node-large" cx="450" cy="120" r="16" />
  <!-- Lead - Management -->
  <circle class="node-large" cx="270" cy="120" r="16" />

  <!-- Horizontal bar (requires mutual agreement) -->
  <line class="bar" x1="100" y1="305" x2="620" y2="305" />
  <text x="635" y="300" class="bar-label">requires mutual agreement</text>
  <text x="635" y="316" class="bar-label">for a promotion</text>

  <!-- Dotted line between Expert and Senior L1 -->
  <line class="dotted" x1="100" y1="455" x2="620" y2="455" />

  <!-- Senior L1 annotation -->
  <text x="100" y="418" class="annotation-emph">valid long-term destination</text>
  <text x="100" y="433" class="annotation-emph">compensation grows with expertise</text>
</svg>
